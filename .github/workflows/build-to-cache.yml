name: Build and Cache
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 3 * * *'
jobs:
  build:
    strategy:
      # Don't cancel the other systems when one fails — each is independent.
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin
    runs-on: ${{ contains(matrix.system, 'darwin') && 'macos-latest' || 'ubuntu-latest' }}
    # NOTE: deliberately NO job-level `env: CACHIX_AUTH_TOKEN`. It used to live
    # here so the push step could gate on its presence, but a job-level env is
    # exported into EVERY step — including `cachix use` below. The cachix CLI
    # reads CACHIX_AUTH_TOKEN from the environment, so a dead token turned an
    # unauthenticated pull from a PUBLIC cache into an auth failure, and the
    # whole build died before compiling anything:
    #
    #   Binary cache rstats-on-nix doesn't exist or you don't have access.
    #   Error: Cachix Auth token "read_write_..." has been revoked.
    #
    # 11 consecutive nightly failures, 2026-08-14 to 2026-08-24, from a
    # credential rotation elsewhere. A missing credential should cost the cache
    # write, never the build. The token is now scoped to the push step alone.
    steps:
      - uses: actions/checkout@v4

      # `secrets.*` cannot be referenced in a step-level `if:`, which is why the
      # token was hoisted to job level in the first place. Converting presence
      # into a step OUTPUT gives the push step something safe to gate on without
      # putting the secret in scope for every other step.
      #
      # Tests non-emptiness only, and never renders the value. In particular NOT
      # `${VAR:+yes}${VAR:-no}` — that construct PRINTS the secret when it is
      # set (see the credential-management rule).
      - name: Detect Cachix push credentials
        id: cachix_creds
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -n "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Cachix auth token is present — closures will be pushed."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cachix auth token — build will run, push will be skipped."
          fi

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            cores = 1
            max-jobs = 1

      - uses: cachix/cachix-action@v15
        with:
          # Public community cache, PULL only. No authToken input, and — since
          # the job-level env block was removed above — no CACHIX_AUTH_TOKEN in
          # this step's environment either. Both are required: the action reads
          # the input via core.getInput("authToken"), but the `cachix` CLI it
          # spawns reads the env var, so dropping only the input is not enough.
          name: rstats-on-nix

      - name: Build default package
        run: nix build .#default --print-build-logs

      - name: Build devShell profile (materialises all buildInputs)
        run: nix develop .#default --profile dev-shell-profile --command true

      - name: Push full closures to Cachix
        # Skipped (CI still green) when no CACHIX_AUTH_TOKEN secret is set, or
        # when the one that is set has been revoked — in the latter case this
        # step fails, but the build above has already succeeded.
        if: ${{ steps.cachix_creds.outputs.present == 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Resolve the real store paths (not the ./result symlink)
          RESULT=$(nix path-info .#default)
          SHELL_DRV=$(nix path-info --derivation .#devShells.$(nix eval --raw --impure --expr 'builtins.currentSystem').default)

          echo "=== Runtime closure of t-lang ==="
          # Push the runtime closure of the built output
          nix path-info --recursive "$RESULT" | cachix push johngavin

          echo "=== Build-time input closure of t-lang ==="
          # Push everything that was needed to *build* t-lang
          # (nativeBuildInputs, buildInputs used only at build time, etc.)
          nix-store --query --requisites "$SHELL_DRV" \
            | grep -v '\.drv$' \
            | cachix push johngavin

          echo "=== DevShell closure ==="
          nix path-info --recursive ./dev-shell-profile \
            | cachix push johngavin
